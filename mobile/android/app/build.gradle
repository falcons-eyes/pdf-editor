apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Release signing (upload key for Google Play; Play App Signing holds the app signing key).
// Nothing secret lives in the repo: each value comes from a Gradle property (e.g. in
// ~/.gradle/gradle.properties) or an environment variable of the same name. See mobile/README.md.
def secret = { String name -> (project.findProperty(name) ?: System.getenv(name))?.toString() }
def uploadStore = secret('SEALWORKS_UPLOAD_STORE_FILE')
// On macOS the password can live in the login Keychain instead of a file:
//   security add-generic-password -a upload -s sealworks-upload-key -w
def keychainPassword = { ->
    if (!System.getProperty('os.name').toLowerCase().contains('mac')) return null
    def p = ['security', 'find-generic-password', '-s', 'sealworks-upload-key', '-w'].execute()
    def out = p.text.trim(); p.waitFor()
    return p.exitValue() == 0 && out ? out : null
}
def uploadPassword = { -> secret('SEALWORKS_UPLOAD_STORE_PASSWORD') ?: keychainPassword() }

android {
    namespace = "com.falconoon.sealworks"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.falconoon.sealworks"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    signingConfigs {
        release {
            if (uploadStore) {
                storeFile file(uploadStore)
                def pw = uploadPassword()
                storePassword pw
                keyAlias secret('SEALWORKS_UPLOAD_KEY_ALIAS') ?: 'upload'
                keyPassword secret('SEALWORKS_UPLOAD_KEY_PASSWORD') ?: pw
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (uploadStore) signingConfig signingConfigs.release
        }
    }
    bundle {
        language {
            // ko/en strings are switched inside the app, so every device needs both
            enableSplit = false
        }
    }
}

kotlin {
    compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21 }
}

if (!uploadStore) {
    gradle.taskGraph.whenReady { graph ->
        if (graph.allTasks.any { it.name in ['bundleRelease', 'assembleRelease'] }) {
            logger.warn("Sealworks: SEALWORKS_UPLOAD_STORE_FILE is not set, the release build is UNSIGNED (see mobile/README.md)")
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
