        const rows = op.table, cols = op.cols || [0.26, 0.74], ws = cols.map((f) => f * TW), rh = op.rh || 56, top = y - 26;
        rows.forEach((row, r) => {

            const cl = typeof cell === "string" ? { t: cell } : cell, w = ws[ci];
            if ((op.head && r === 0) || (op.lab !== false && cols.length === 2 && ci === 0)) { g.fillStyle = DOC_SOFT; g.fillRect(x, ry, w, rh); }

  return cached(`${id}|${lang}|assets`, async () => {
    const T = EXAMPLES[id][lang];
    await exFonts(exText(T.assets));
    const out = {};
    for (const [k, spec] of Object.entries(T.assets)) out[k] = await buildExampleAsset(spec, lang);
    return out;
  });
}
function examplePdf(id, lang) {
  return cached(`${id}|${lang}|pdf`, async () => {
    const T = EXAMPLES[id][lang];
    await exFonts(exText(T.pages));
    const { canvases, anchors } = paintDoc(T.pages);
    const { PDFDocument } = window.PDFLib, doc = await PDFDocument.create();
    for (const c of canvases) {
      const jpg = await doc.embedJpg(dataURLBytes(c.toDataURL("image/jpeg", 0.9)));
      doc.addPage([595.28, 841.89]).drawImage(jpg, { x: 0, y: 0, width: 595.28, height: 841.89 });

// one placement → overlays (page points; the drawing is 1240 px wide)
function examplePlace(pl, set, anchors) {
  if (pl.gan) { const a = set[pl.gan]; return a ? ganPieces(a.id, pl.w * PT_PER_MM, pl.y ?? 0.42, { fx: { removeBg: !!a.autoRemoveBg, ink: null }, opacity: pl.op ?? 0.92 }) : []; }
  const a = set[pl.a], an = anchors[pl.at], p = S.pages[an?.page]; if (!a || !p) return [];
  const k = p.w / DOC.W, ratio = a.h / a.w;
  let w = (pl.w || 20) * PT_PER_MM, h = w * ratio;
  if (pl.pt && a.em) { h = (a.h * pl.pt) / a.em; w = h / ratio; } else if (pl.h) { h = pl.h * PT_PER_MM; w = h / ratio; }
  const cx = (pl.al === "l" ? an.x * k + 2 + w / 2 : (an.x + an.w / 2) * k) + (pl.dx || 0) * PT_PER_MM;
  // a handwritten signature on a line: the writing sits on it and the flourish under the name touches it
  const cy = (an.line && a.kind === "draw" ? (an.y + an.h) * k - h * 0.4 : (an.y + an.h / 2) * k) + (pl.dy || 0) * PT_PER_MM;
  return [{ id: uid(), assetId: a.id, page: an.page, x: cx - w / 2, y: cy - h / 2, w, h, rot: pl.rot || 0, opacity: pl.op ?? 1, fx: { removeBg: !!a.autoRemoveBg, ink: null }, ...(pl.sel ? { sel: true } : {}) }];
}

let exBusy = null;
async function loadExample(id = "freelance", lang = LANG) {
  if (!EXAMPLES[id]) throw new Error(`no example "${id}" (${EX_ORDER.join(", ")})`);
  if (!LANGS.includes(lang)) lang = LANG;
  if (exBusy) return false;
  exBusy = id; syncExampleBusy();
  try {
    if (id === "freelance") return await openFreelance(lang);
    const T = EXAMPLES[id][lang];
    const [set, { bytes, anchors }] = await Promise.all([exampleSet(id, lang), examplePdf(id, lang)]);
    useSampleSet(set); syncLibrary();
    if (!(await openPdfBytes(bytes, T.file, { sample: true, sampleLang: lang, exampleId: id }))) return false;
    syncLibrary(); // the editor's panel lists the example's items first
    const items = T.place.flatMap((pl) => examplePlace(pl, set, anchors));
    const focus = items.find((o) => o.sel); for (const o of items) delete o.sel;
    S.overlays.push(...items); S.sel = focus?.id || null;
    syncOverlays(); syncInspector(); syncDocTitle();
    const show = focus || items[items.length - 1];
    if (show) requestAnimationFrame(() => { const p = S.pages[show.page]; stage.scrollTop = p.el.offsetTop + (show.y + show.h / 2) * S.zoom - stage.clientHeight / 2; });
    if (EXAMPLES[id].after) await EXAMPLES[id].after(lang);

  } catch (e) {

}

   A text stamp may hold {fields}: {page} {pages} {date} {date:YYYY.MM.DD} (or {쪽} {전체쪽} {날짜}) fill themselves;
   any other {name} is a field the person fills in. The Library item keeps the template (asset.tpl: { look, text, sub,
   font, color }, look "plain" | "box" | "wm") and every placed item is drawn per page with the values filled in. The
   editor shows a missing value as a dashed chip with the field's name; a saved file never contains a brace: a value
   still missing at save time is asked for in the save dialog, and left blank if the person leaves it empty.
   A form (서식) is the layout of placed items saved apart from the document; make many builds one PDF per row of a
   list, or the same items on several PDFs, one file at a time into one picked folder, never replacing a file.
   ================================================================ */

function ksExitButton() {
  const b = el("button", { type: "button", class: "ks-exit", id: "ks-exit", "aria-label": t("ks.exit.btn") }, kIcon("exit"));
  let timer = 0, fired = false;
