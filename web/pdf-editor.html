<title>Sealworks</title>
<script type="application/json" id="claude-artifacts-manifest">{"permissions": ["full-access"]}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@800&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: desktop document app — title bar / (home: document list | library) or (editor: page rail | paper stage | library + inspector) / status bar.
   Ink-blue accent (pen signature), seal red reserved for stamp-related cues. */
:root {
  --bg: #e9ecf2;          /* stage behind the paper */
  --surface: #fbfcfe;     /* bars and panels */
  --panel: #f3f5f9;
  --line: #dde1ea;
  --line-strong: #c9cfdb;
  --fg: #171a22;
  --muted: #5f6779;
  --faint: #687083;       /* WCAG AA (4.5:1) on --panel and --surface */
  --accent: #2446c7;      /* ballpoint ink */
  --accent-fg: #ffffff;
  --accent-soft: #e4e9fb;
  --seal: #c3302a;        /* stamp ink (인주) */
  --seal-soft: #f9e5e3;
  --ok: #19794a;
  --ok-soft: #e2f3ea;
  --amber: #9a5a00;       /* "modified after sealing": changed, not forged */
  --amber-soft: #fbf0dc;
  --paper: #ffffff;
  --paper-shadow: 0 1px 2px rgba(20, 28, 52, .10), 0 6px 20px rgba(20, 28, 52, .08);
  --checker-a: #f1f3f7;
  --checker-b: #e3e7ee;
  --focus: #2446c7;
  --font-ui: "IBM Plex Sans KR", -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 8px;
  --bar-h: 52px;
  --status-h: 28px;
  --rail-w: 156px;
  --side-w: 300px;
  --traffic: 0px;
  /* safe areas (phones: status bar, notch, gesture bar); 0 on desktops. The page pads its own bars,
     so the skeleton's padding on :root is taken back below and backgrounds reach the screen edges */
  --sat: env(safe-area-inset-top, var(--safe-area-inset-top, 0px)); --sab: env(safe-area-inset-bottom, var(--safe-area-inset-bottom, 0px));
  --sal: env(safe-area-inset-left, var(--safe-area-inset-left, 0px)); --sar: env(safe-area-inset-right, var(--safe-area-inset-right, 0px));
  --bb-h: 0px;            /* bottom toolbar (compact layout) */
}
:root { padding-top: 0; padding-bottom: 0; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --surface: #1b1e25; --panel: #171a20; --line: #2a2f39; --line-strong: #3a404c;
    --fg: #e8eaf0; --muted: #a0a7b6; --faint: #8d95a6;
    --accent: #8299ff; --accent-fg: #0d1230; --accent-soft: #232b4d;
    --seal: #ff7468; --seal-soft: #3a2022; --ok: #5ccf94; --ok-soft: #173326; --amber: #f0b45e; --amber-soft: #382b16;
    --paper: #ffffff; --paper-shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 28px rgba(0,0,0,.45);
    --checker-a: #eef0f4; --checker-b: #dde1e8; --focus: #8299ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111318; --surface: #1b1e25; --panel: #171a20; --line: #2a2f39; --line-strong: #3a404c;
  --fg: #e8eaf0; --muted: #a0a7b6; --faint: #8d95a6;
  --accent: #8299ff; --accent-fg: #0d1230; --accent-soft: #232b4d;
  --seal: #ff7468; --seal-soft: #3a2022; --ok: #5ccf94; --ok-soft: #173326; --amber: #f0b45e; --amber-soft: #382b16;
  --paper: #ffffff; --paper-shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 28px rgba(0,0,0,.45);
  --checker-a: #eef0f4; --checker-b: #dde1e8; --focus: #8299ff;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 13px;
  overflow: hidden; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.is-desktop { --traffic: 76px; }
/* Windows: no traffic lights; the standalone app's window buttons sit over the right end of the title bar */
.is-win { --traffic: 0px; }
.is-overlay { --wctl: 138px; }
.mono { font-family: var(--font-num); font-size: 12px; }

#app { height: 100%; display: grid; grid-template-rows: calc(var(--bar-h) + var(--sat)) minmax(0, 1fr) calc(var(--status-h) + var(--sab)); }

/* ---------- title bar ---------- */
.titlebar {
  display: flex; align-items: center; gap: 12px; min-width: 0; padding-top: var(--sat);
  padding-left: max(calc(16px + var(--sal)), calc(var(--traffic) + 8px)); padding-right: calc(16px + var(--wctl, 0px) + var(--sar));
  background: var(--surface); border-bottom: 1px solid var(--line);
  app-region: drag; -webkit-app-region: drag;
}
.titlebar > *, .tb-editor > * { app-region: no-drag; -webkit-app-region: no-drag; }
.titlebar .grow { flex: 1; app-region: drag; -webkit-app-region: drag; }
.tb-editor { display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; app-region: drag; -webkit-app-region: drag; }
.brand-mark { width: 22px; height: 22px; flex: none; }
.doc-name { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.doc-name strong { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }
.doc-name span { color: var(--muted); font-size: 11px; white-space: nowrap; }
.doc-name .dirty { color: var(--seal); }
.tb-group { display: flex; align-items: center; gap: 2px; padding: 2px; border-radius: 9px; background: var(--panel); border: 1px solid var(--line); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 30px; padding: 0 10px; border-radius: 7px; border: 1px solid transparent;
  background: transparent; cursor: pointer; white-space: nowrap; color: var(--fg);
}
.btn:hover:not(:disabled) { background: color-mix(in oklab, var(--fg) 8%, transparent); }
.btn:active:not(:disabled) { background: color-mix(in oklab, var(--fg) 14%, transparent); }
.btn:disabled { opacity: .38; cursor: default; }
.btn.icon { width: 30px; padding: 0; }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.outline { border-color: var(--line-strong); background: var(--surface); }
.btn.primary { background: var(--accent); color: var(--accent-fg); font-weight: 600; padding: 0 14px; }
.btn.primary:hover:not(:disabled) { background: color-mix(in oklab, var(--accent) 88%, black); }
.btn.danger { color: var(--seal); }
.btn.sm { height: 26px; padding: 0 8px; font-size: 12px; }
.zoom-val { width: 52px; text-align: center; font-family: var(--font-num); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }

/* ---------- home (document list) ---------- */
.home { display: grid; grid-template-columns: minmax(0, 1fr) var(--side-w); min-height: 0; }
.home-main { overflow-y: auto; min-width: 0; padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; }
.home-wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 16px; padding: 0 16px; }
.home-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.home-head h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.home-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.search { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); min-width: 220px; }
.search:focus-within { border-color: var(--accent); }
.search svg { width: 14px; height: 14px; color: var(--faint); flex: none; }
.search input { border: none; background: none; outline: none; width: 100%; min-width: 0; user-select: text; -webkit-user-select: text; }
.perm {
  display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 10px;
  background: var(--accent-soft); border: 1px solid color-mix(in oklab, var(--accent) 30%, transparent);
}
.perm svg { width: 22px; height: 22px; color: var(--accent); flex: none; }
.perm p { margin: 0; flex: 1; line-height: 1.55; min-width: 0; }
.perm b { font-weight: 600; }
.doc-list { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.doc-row, .doc-head {
  display: grid; grid-template-columns: minmax(0, 1fr) 170px 210px 92px; align-items: center; gap: 14px;
  padding: 10px 14px 10px 10px; border-bottom: 1px solid var(--line); min-width: 0;
}
.doc-head { padding-block: 7px; background: var(--panel); font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--faint); }
.doc-head span:first-child { padding-left: 52px; }
.cell { display: grid; gap: 4px; justify-items: start; min-width: 0; }
.cell small { color: var(--muted); font-size: 11px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell small.warn { color: var(--seal); }
.doc-acts { justify-content: flex-end; }
.doc-row:last-child { border-bottom: none; }
.doc-row:hover { background: color-mix(in oklab, var(--accent) 4%, var(--surface)); }
.doc-row.current { box-shadow: inset 3px 0 0 var(--accent); }
.doc-open { display: flex; align-items: center; gap: 12px; min-width: 0; border: none; background: none; padding: 0; cursor: pointer; text-align: left; }
.doc-thumb { width: 40px; height: 52px; flex: none; border-radius: 3px; background: var(--paper); box-shadow: 0 0 0 1px var(--line-strong); overflow: hidden; display: grid; place-items: center; }
.doc-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.doc-title { display: grid; gap: 3px; min-width: 0; }
.doc-title strong { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doc-title span { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { justify-self: start; display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
.chip i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.work { background: var(--accent-soft); color: var(--accent); }
.chip.muted { background: var(--panel); color: var(--muted); }
.chip.warn { background: var(--seal-soft); color: var(--seal); }
/* "needs permission to check" (store build): not an alarm, an action; lock icon + words, not colour alone */
.chip.perm { background: var(--amber-soft); color: var(--amber); }
.src-perm { color: var(--amber); font-weight: 500; }
.src-warn { color: var(--seal); font-weight: 500; }
.doc-acts { display: flex; gap: 2px; }
.doc-acts .btn { color: var(--muted); }
.doc-acts .btn:hover { color: var(--fg); }
.home-empty { display: grid; justify-items: center; gap: 10px; text-align: center; padding: 56px 24px; border: 1.5px dashed var(--line-strong); border-radius: 14px; background: var(--surface); }
.home-empty svg { width: 72px; height: 72px; }
.home-empty h2 { margin: 0; font-size: 18px; font-weight: 600; }
.home-empty p { margin: 0 0 8px; color: var(--muted); max-width: 40ch; line-height: 1.6; text-wrap: balance; }
.home-empty .row-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.no-match { padding: 28px; text-align: center; color: var(--muted); }
/* example gallery: situation cards (icon, the person's words, one line, Try) */
.ex { display: grid; gap: 10px; margin-top: 8px; }
.ex-head { display: grid; gap: 2px; }
.ex-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.ex-toggle { display: inline-flex; align-items: center; gap: 6px; height: 32px; margin-left: -8px; padding: 0 8px; border: none; border-radius: 8px; background: none; font: inherit; font-weight: 600; color: var(--fg); cursor: pointer; }
.ex-toggle:hover { background: color-mix(in oklab, var(--fg) 7%, transparent); }
.ex-toggle svg { width: 14px; height: 14px; color: var(--muted); transition: transform .15s; }
.ex-toggle[aria-expanded="false"] svg { transform: rotate(-90deg); }
.ex-toggle .n { color: var(--muted); font-weight: 400; font-size: 12px; }
.ex-sub { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
.ex-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.ex-list li { display: flex; min-width: 0; }
.ex-card {
  flex: 1; min-width: 0; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left;
  padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; font: inherit;
}
.ex-card:hover:not(:disabled) { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 4%, var(--surface)); }
.ex-card:disabled { cursor: default; opacity: .55; }
.ex-card[aria-busy="true"] { opacity: 1; border-color: var(--accent); }
.ex-ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.ex-ic.seal { background: var(--seal-soft); color: var(--seal); }
.ex-ic svg { width: 20px; height: 20px; }
.ex-txt { display: grid; gap: 3px; min-width: 0; }
.ex-txt strong { font-weight: 600; font-size: 13px; line-height: 1.45; }
.ex-txt span { color: var(--muted); font-size: 12px; line-height: 1.45; }
:lang(ko) .ex-txt { word-break: keep-all; }
.ex-go { display: inline-flex; align-items: center; gap: 2px; color: var(--accent); font-size: 12px; font-weight: 600; white-space: nowrap; }
.ex-go svg { width: 14px; height: 14px; }
.ex-go .spinner { width: 12px; height: 12px; }

/* ---------- editor grid ---------- */
.main { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr) var(--side-w); min-height: 0; }
.main.no-rail { grid-template-columns: 0 minmax(0, 1fr) var(--side-w); }
.main.no-rail .rail { visibility: hidden; }

.rail { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; overflow-x: hidden; padding: 14px 0 24px; }
.thumbs { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.thumb { display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; border: none; background: none; padding: 0; }
.thumb-box { position: relative; width: 104px; background: var(--paper); box-shadow: 0 0 0 1px var(--line-strong); border-radius: 2px; overflow: hidden; }
.thumb canvas { display: block; width: 100%; height: 100%; }
.thumb .thumb-num { font-family: var(--font-num); font-size: 11px; color: var(--muted); padding: 1px 7px; border-radius: 10px; }
.thumb.current .thumb-box { box-shadow: 0 0 0 2px var(--accent); }
.thumb.current .thumb-num { background: var(--accent); color: var(--accent-fg); }
.thumb .dot { position: absolute; right: 4px; top: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--seal); box-shadow: 0 0 0 2px var(--paper); }

/* one finger scrolls natively; two fingers are the page's own pinch-zoom and pan (no browser zoom) */
.stage { position: relative; overflow: auto; min-width: 0; overscroll-behavior: contain; touch-action: pan-x pan-y; }
.pages { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 28px 32px 64px; width: max-content; min-width: 100%; box-sizing: border-box; }
.page { position: relative; background: var(--paper); box-shadow: var(--paper-shadow); flex: none; }
.page canvas.render { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.page .layer { position: absolute; inset: 0; }
.page .pageno { position: absolute; left: 0; bottom: -18px; font-family: var(--font-num); font-size: 10px; color: var(--muted); }
.page.loading::after {
  content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(120,130,160,.08) 50%, transparent 70%);
  background-size: 200% 100%; animation: shimmer 1.2s linear infinite;
}
@keyframes shimmer { to { background-position: -200% 0; } }
.sample-bar {
  position: sticky; top: 12px; z-index: 5; margin: 12px auto -40px; width: fit-content; max-width: calc(100% - 32px);
  display: flex; align-items: center; gap: 12px; padding: 6px 6px 6px 14px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--line); box-shadow: 0 4px 16px rgba(20, 28, 52, .10); font-size: 12px; color: var(--muted);
}
.sample-bar b { color: var(--fg); font-weight: 600; }

/* overlays */
.ov { position: absolute; transform-origin: 50% 50%; cursor: grab; touch-action: none; }
.ov img { display: block; width: 100%; height: 100%; pointer-events: none; user-select: none; -webkit-user-drag: none; }
@media (hover: hover) { .ov:hover { outline: 1px dashed color-mix(in oklab, var(--accent) 60%, transparent); } }
.ov.sel { outline: 1.5px solid var(--accent); cursor: move; z-index: 3; }
.ov.dragging { cursor: grabbing; }
/* 간인: each piece shows one half of the stamp against the page edge; the box is that half */
.ov.gan img { object-fit: cover; object-position: left center; }
.ov.gan[data-side="r"] img { object-position: right center; }
.ov.gan .h.rot { display: none; }
.ov.gan-peer { outline: 1.5px dashed color-mix(in oklab, var(--accent) 70%, transparent); }
.mark-sw svg { width: 16px; height: 16px; }
#txt-marks-hint { flex-basis: 100%; margin: -4px 0 0; }
/* keyboard focus on a placed item: the paper is always white, so a fixed ink-blue ring keeps 3:1 in both themes */
.ov:focus { outline: none; }
.ov:focus-visible { outline: 2.5px solid #2446c7; outline-offset: 3px; box-shadow: 0 0 0 1.5px #fff; z-index: 4; }
.h { position: absolute; width: 10px; height: 10px; background: #fff; border: 1.5px solid var(--accent); border-radius: 2px; box-sizing: border-box; }
.h.tl { left: -6px; top: -6px; cursor: nwse-resize; } .h.br { right: -6px; bottom: -6px; cursor: nwse-resize; }
.h.tr { right: -6px; top: -6px; cursor: nesw-resize; } .h.bl { left: -6px; bottom: -6px; cursor: nesw-resize; }
.h.rot { left: 50%; top: -30px; margin-left: -6px; width: 12px; height: 12px; border-radius: 50%; cursor: grab; }
.h.rot::after { content: ""; position: absolute; left: 4.25px; top: 10px; width: 1.5px; height: 14px; background: var(--accent); }
.guide { position: absolute; background: var(--seal); pointer-events: none; z-index: 4; }
.guide.v { width: 1px; top: 0; bottom: 0; } .guide.h { height: 1px; left: 0; right: 0; }
.measure {
  position: absolute; z-index: 6; pointer-events: none; transform: translate(-50%, -140%);
  background: var(--fg); color: var(--bg); font-family: var(--font-num); font-size: 11px; padding: 2px 6px; border-radius: 5px; white-space: nowrap;
}
.drop-veil {
  position: fixed; inset: calc(var(--bar-h) + 10px) 10px calc(var(--status-h) + 10px); border: 2px dashed var(--accent); border-radius: 14px; z-index: 20;
  background: color-mix(in oklab, var(--accent) 8%, transparent); display: grid; place-items: center; pointer-events: none;
}
.drop-veil div { background: var(--surface); padding: 10px 16px; border-radius: 10px; font-weight: 600; box-shadow: 0 6px 24px rgba(0,0,0,.12); }

/* ---------- side panel (library + inspector) ---------- */
.side { background: var(--surface); border-left: 1px solid var(--line); min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.sec { padding: 14px 16px; border-bottom: 1px solid var(--line); }
.sec:last-child { border-bottom: none; }
.sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
.sec-title { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--muted); }
.add-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
.add-btn {
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 4px 8px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 12px; color: var(--fg);
}
.add-btn svg { width: 18px; height: 18px; color: var(--accent); }
.add-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
.lib { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile {
  position: relative; display: flex; flex-direction: column; border-radius: var(--radius); border: 1px solid var(--line);
  background: var(--surface); overflow: hidden; text-align: left; padding: 0;
}
.tile:hover, .tile:focus-within { border-color: var(--accent); }
.tile-main { display: flex; flex-direction: column; width: 100%; border: none; background: none; padding: 0; margin: 0; text-align: left; cursor: pointer; color: inherit; border-radius: inherit; }
div.tile-main { cursor: default; }
.tile-main:focus-visible { outline-offset: -2px; }
.tile .art {
  height: 64px; display: grid; place-items: center; padding: 8px;
  background-color: var(--checker-a);
  background-image: linear-gradient(45deg, var(--checker-b) 25%, transparent 25%, transparent 75%, var(--checker-b) 75%), linear-gradient(45deg, var(--checker-b) 25%, transparent 25%, transparent 75%, var(--checker-b) 75%);
  background-size: 12px 12px; background-position: 0 0, 6px 6px;
}
.tile .art img { max-height: 48px; max-width: 100%; object-fit: contain; pointer-events: none; }
.tile .meta { display: flex; align-items: center; gap: 6px; padding: 6px 8px; font-size: 11.5px; min-width: 0; }
.tile .meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.tag { flex: none; font-size: 10px; padding: 1px 5px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-style: normal; }
.tag.seal { background: var(--seal-soft); color: var(--seal); }
.tag.sample { background: var(--panel); color: var(--muted); border: 1px solid var(--line); }
.tile .tile-acts { position: absolute; top: 4px; right: 4px; display: flex; gap: 3px; opacity: 0; transition: opacity .12s; }
.tile:hover .tile-acts, .tile:focus-within .tile-acts { opacity: 1; }
.tile-acts button {
  width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--surface); color: var(--muted);
  cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.15); font-size: 13px; border: none; padding: 0;
}
.tile-acts button:hover { color: var(--fg); }
.tile-acts button.x:hover { color: var(--seal); }
.tile-acts svg { width: 12px; height: 12px; }
.hint { color: var(--muted); font-size: 12px; line-height: 1.6; }
.kbd { font-family: var(--font-num); font-size: 10.5px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--fg); justify-self: start; }
.store-info { display: grid; gap: 8px; }
.store-info .path { word-break: break-all; color: var(--fg); }

.insp-empty { display: grid; gap: 10px; }
.shortcuts { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 12px; color: var(--muted); align-items: center; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.field { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); }
.field:focus-within { border-color: var(--accent); }
.field label { color: var(--faint); font-size: 11px; width: 12px; flex: none; }
.field input { width: 100%; min-width: 0; border: none; background: none; outline: none; font-family: var(--font-num); font-size: 12px; font-variant-numeric: tabular-nums; user-select: text; -webkit-user-select: text; }
.field .unit { color: var(--faint); font-size: 10.5px; }
.row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.row > .lbl { width: 56px; flex: none; color: var(--muted); font-size: 12px; }
.row input[type=range] { flex: 1; accent-color: var(--accent); }
.row .val { width: 40px; text-align: right; font-family: var(--font-num); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.sw {
  height: 26px; min-width: 26px; padding: 0 8px; border-radius: 13px; border: 1px solid var(--line-strong); background: var(--surface);
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 11.5px;
}
.sw i { width: 12px; height: 12px; border-radius: 50%; display: block; box-shadow: 0 0 0 1px color-mix(in oklab, var(--fg) 28%, transparent); }
.sw[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12px; }
.toggle input { accent-color: var(--accent); width: 15px; height: 15px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 14px; }
.actions .btn { justify-content: flex-start; border: 1px solid var(--line); background: var(--panel); }
.actions .wide { grid-column: 1 / -1; }
.sel-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.sel-head .art { width: 44px; height: 32px; border-radius: 6px; border: 1px solid var(--line); display: grid; place-items: center; background: var(--checker-a); flex: none; }
.sel-head .art img { max-width: 40px; max-height: 28px; }
.sel-head .nm { min-width: 0; flex: 1; display: grid; gap: 2px; }
.sel-head input { width: 100%; box-sizing: border-box; border: 1px solid transparent; border-radius: 6px; background: none; padding: 2px 4px; margin-left: -5px; font-weight: 600; outline: none; user-select: text; -webkit-user-select: text; }
.sel-head input:hover { border-color: var(--line); }
.sel-head input:focus { border-color: var(--accent); background: var(--panel); }
.sel-head span { color: var(--muted); font-size: 11.5px; }

/* ---------- status bar ---------- */
.status {
  display: flex; align-items: center; gap: 16px; padding-left: calc(16px + var(--sal)); padding-right: calc(16px + var(--sar)); padding-bottom: var(--sab); min-width: 0;
  background: var(--surface); border-top: 1px solid var(--line); color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden;
}
.status .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.status .grow { flex: 1; }
.status .private { display: inline-flex; align-items: center; gap: 6px; color: var(--ok); }
.status .private svg { width: 13px; height: 13px; }
.status .about-btn { border: none; background: none; padding: 0 4px; height: 20px; border-radius: 4px; cursor: pointer; color: var(--muted); font-size: 11.5px; }
.status .about-btn:hover { color: var(--fg); background: color-mix(in oklab, var(--fg) 7%, transparent); }
/* text only for screen readers (live announcements, headings the layout doesn't show) */
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
/* about Sealworks: links to privacy policy, support, source */
.about-links { display: grid; gap: 6px; }
.about-links a { display: flex; align-items: center; gap: 8px; color: var(--accent); text-decoration: none; padding: 6px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); }
.about-links a:hover { border-color: var(--accent); }
.about-links a svg { width: 14px; height: 14px; flex: none; }
.lic-pick { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.lic-pick select { font: inherit; font-size: 13px; color: var(--text); padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); width: 100%; min-width: 0; }
.lic-text { margin: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); font: 12px/1.5 "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; max-height: min(55vh, 520px); overflow: auto; }
#dlg-licenses .dlg-body { grid-template-columns: minmax(0, 1fr); }
@media (min-width: 700px) { #dlg-licenses { width: min(720px, calc(100vw - 32px)); } }
.side-links { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; }
.side-links a { color: var(--accent); text-decoration: none; }
.side-links a:hover { text-decoration: underline; }
.alt-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.alt-row .btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }

/* ---------- dialogs ---------- */
dialog {
  border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--surface); color: var(--fg);
  width: min(600px, calc(100vw - 32px)); box-shadow: 0 24px 60px rgba(10, 14, 30, .28);
}
dialog::backdrop { background: rgba(14, 18, 30, .38); }
.dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dlg-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.dlg-body { padding: 16px 18px; display: grid; gap: 14px; }
.dlg-foot { display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
.dlg-foot .grow { flex: 1; }
.fld-label { font-size: 12px; color: var(--muted); font-weight: 500; }
.pad-wrap { position: relative; border-radius: 10px; border: 1px solid var(--line-strong); background: #fff; overflow: hidden; }
.pad-wrap canvas { display: block; width: 100%; height: 220px; touch-action: none; cursor: crosshair; }
.pad-wrap .baseline { position: absolute; left: 24px; right: 24px; bottom: 56px; border-bottom: 1px dashed #c9cfdb; pointer-events: none; }
.pad-wrap .pad-hint { position: absolute; left: 24px; bottom: 34px; color: #687083; font-size: 12px; pointer-events: none; }
.text-input { width: 100%; box-sizing: border-box; height: 40px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--panel); font-size: 15px; user-select: text; -webkit-user-select: text; }
.text-input:focus { outline: none; border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.preview-box { border-radius: 10px; border: 1px solid var(--line); background: #fff; height: 120px; display: grid; place-items: center; overflow: hidden; }
.preview-box canvas { max-width: 100%; max-height: 110px; }
.seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--panel); border: 1px solid var(--line); }
.seg button { border: none; background: none; height: 28px; padding: 0 12px; border-radius: 7px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }
.opt-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.opt-row .lbl { color: var(--muted); font-size: 12px; width: 44px; }

/* save dialog */
.name-row { display: flex; align-items: center; gap: 8px; }
.name-row .ext { color: var(--muted); font-family: var(--font-num); }
.dir-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.dir-box { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); min-width: 0; }
.dir-box svg { width: 16px; height: 16px; color: var(--accent); flex: none; }
.dir-box span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.save-msg { margin: 0; font-size: 12.5px; min-height: 1em; }
.save-msg.warn { color: var(--seal); }

/* file browser */
dialog.fb-dlg { width: min(940px, calc(100vw - 32px)); }
.fb { display: grid; grid-template-columns: 172px minmax(0, 1fr); height: min(460px, calc(100vh - 220px)); min-height: 280px; }
.fb.with-preview { grid-template-columns: 172px minmax(0, 1fr) 200px; }
.fb-places { border-right: 1px solid var(--line); padding: 10px 8px; overflow-y: auto; display: grid; align-content: start; gap: 2px; background: var(--panel); }
.fb-places .cap { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; color: var(--faint); padding: 8px 8px 4px; }
.fb-places button { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border: none; border-radius: 6px; background: none; cursor: pointer; text-align: left; min-width: 0; }
.fb-places button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fb-places button svg { width: 15px; height: 15px; color: var(--accent); flex: none; }
.fb-places button:hover { background: color-mix(in oklab, var(--fg) 7%, transparent); }
.fb-places button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.fb-main { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; }
.fb-bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); min-width: 0; }
.fb-crumbs { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.fb-crumbs button { border: none; background: none; height: 26px; padding: 0 6px; border-radius: 5px; cursor: pointer; white-space: nowrap; color: var(--muted); }
.fb-crumbs button:last-child { color: var(--fg); font-weight: 600; }
.fb-crumbs button:hover { background: color-mix(in oklab, var(--fg) 7%, transparent); }
.fb-crumbs i { color: var(--faint); font-style: normal; }
.fb-bar .search { min-width: 170px; height: 28px; }
.fb-list { overflow-y: auto; outline: none; padding: 4px 0; }
.fb-row { display: grid; grid-template-columns: 20px minmax(0, 1fr) 96px 64px; gap: 10px; align-items: center; height: 30px; padding: 0 12px; cursor: default; }
.fb-row svg { width: 16px; height: 16px; }
.fb-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fb-row .dt, .fb-row .sz { color: var(--muted); font-size: 11.5px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.fb-row.folder svg { color: var(--accent); }
.fb-row.file svg { color: var(--seal); }
.fb-row.dim { opacity: .45; }
.fb-row:hover { background: color-mix(in oklab, var(--fg) 5%, transparent); }
.fb-row[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); }
.fb-row[aria-selected="true"] svg, .fb-row[aria-selected="true"] .dt, .fb-row[aria-selected="true"] .sz { color: var(--accent-fg); }
.fb-row.cursor:not([aria-selected="true"]) { box-shadow: inset 0 0 0 1.5px var(--accent); }
.fb-note { padding: 24px; color: var(--muted); text-align: center; }
.fb-preview { border-left: 1px solid var(--line); padding: 12px; display: grid; align-content: start; gap: 8px; background: var(--panel); min-width: 0; }
.fb-preview .pv { aspect-ratio: 4 / 3; border-radius: 8px; display: grid; place-items: center; overflow: hidden;
  background-color: var(--checker-a); background-image: linear-gradient(45deg, var(--checker-b) 25%, transparent 25%, transparent 75%, var(--checker-b) 75%), linear-gradient(45deg, var(--checker-b) 25%, transparent 25%, transparent 75%, var(--checker-b) 75%);
  background-size: 12px 12px; background-position: 0 0, 6px 6px; }
.fb-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
.fb-preview span { font-size: 11.5px; color: var(--muted); word-break: break-all; }

/* toast */
.toasts { position: fixed; left: 50%; bottom: calc(var(--status-h) + 16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; gap: 8px; z-index: 50; pointer-events: none; justify-items: center; }
.toast { display: flex; align-items: center; gap: 12px; background: var(--fg); color: var(--bg); padding: 8px 8px 8px 14px; border-radius: 10px; font-size: 12.5px; box-shadow: 0 8px 24px rgba(0,0,0,.2); animation: rise .18s ease-out; max-width: min(560px, calc(100vw - 32px)); pointer-events: auto; }
.toast > span { padding-block: 1px; }
.toast.plain { padding-right: 14px; }
.toast.err { background: var(--seal); color: #fff; }
.toast button { border: none; background: color-mix(in oklab, var(--bg) 16%, transparent); color: inherit; height: 26px; padding: 0 10px; border-radius: 6px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.toast button:hover { background: color-mix(in oklab, var(--bg) 26%, transparent); }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* panels that can be shown or hidden */
.home.no-side { grid-template-columns: minmax(0, 1fr) 0; }
.home.no-side > .side, .main.no-side > .side { display: none; }
.main.no-side { grid-template-columns: var(--rail-w) minmax(0, 1fr) 0; }
.main.no-side.no-rail { grid-template-columns: 0 minmax(0, 1fr) 0; }
.btn.icon[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in oklab, var(--accent) 35%, transparent); }
.btn.back { padding: 0 10px 0 6px; gap: 2px; }
.explain { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--muted); line-height: 1.5; }
.explain b { color: var(--fg); font-weight: 600; margin-right: 4px; }
.warnbar { border-color: color-mix(in oklab, var(--seal) 40%, var(--line)); background: color-mix(in oklab, var(--seal) 6%, var(--surface)); color: var(--fg); max-width: min(760px, calc(100% - 32px)); }
.warnbar b { color: var(--seal); }
.warnbar .btn { flex: none; }
/* tooltip: action name + shortcut, shown quickly on hover or keyboard focus */
.tip {
  position: fixed; z-index: 100; pointer-events: none; display: flex; align-items: center; gap: 8px; max-width: 320px;
  background: var(--fg); color: var(--bg); font-size: 12px; line-height: 1.4; padding: 5px 8px; border-radius: 6px;
  box-shadow: 0 6px 18px rgba(0,0,0,.18); opacity: 0; transform: translateY(-3px); transition: opacity .12s, transform .12s;
}
.tip.show { opacity: 1; transform: none; }
.tip kbd { font-family: var(--font-num); font-size: 11px; padding: 0 4px; border-radius: 4px; background: color-mix(in oklab, var(--bg) 18%, transparent); white-space: nowrap; }

/* language switch in the status bar: endonyms, the current one emphasised */
.lang-sw { display: inline-flex; align-items: center; gap: 2px; }
.lang-sw button { border: none; background: none; padding: 0 3px; height: 20px; border-radius: 4px; cursor: pointer; color: var(--muted); font-size: 11.5px; }
.lang-sw button:hover { color: var(--fg); background: color-mix(in oklab, var(--fg) 7%, transparent); }
.lang-sw button[aria-pressed="true"] { color: var(--fg); font-weight: 600; }
.lang-sw i { font-style: normal; color: var(--faint); }

/* ---------- seal (tamper-evident PDF): standalone app only ---------- */
html:not(.has-seal) .seal-only { display: none !important; }
.chip-row { display: flex; gap: 4px; flex-wrap: wrap; min-width: 0; }
.chip.sealed { background: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--fg); }
.chip svg { width: 11px; height: 11px; }
.seal-opt { display: grid; gap: 8px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
.seal-opt .toggle { align-items: flex-start; font-size: 13px; }
.seal-opt .toggle input { margin-top: 2px; }
.seal-opt .toggle small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.seal-opt .who { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); min-width: 0; }
.seal-opt .who svg { width: 14px; height: 14px; flex: none; }
.seal-opt .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.form-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.form-grid label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.form-grid .text-input { height: 34px; font-size: 13px; }
.v-drop { display: grid; justify-items: center; gap: 8px; padding: 22px 16px; border: 1.5px dashed var(--line-strong); border-radius: 12px; text-align: center; }
.v-drop svg { width: 34px; height: 34px; color: var(--accent); }
.v-drop p { margin: 0; color: var(--muted); }
.v-drop.over { border-color: var(--accent); background: var(--accent-soft); }
.v-drop.compact { grid-auto-flow: column; justify-content: start; padding: 8px 12px; text-align: left; }
.v-drop.compact svg { width: 18px; height: 18px; }
.v-drop.compact .hint { display: none; }
.v-file { display: flex; gap: 8px; align-items: baseline; min-width: 0; font-size: 12px; color: var(--muted); }
.v-file strong { color: var(--fg); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.v-status { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; }
.v-status svg { width: 26px; height: 26px; flex: none; }
.v-status h3 { margin: 0 0 3px; font-size: 15px; font-weight: 600; }
.v-status p { margin: 0; line-height: 1.55; color: var(--fg); }
.v-status.ok { background: var(--ok-soft); } .v-status.ok svg, .v-status.ok h3 { color: var(--ok); }
.v-status.amber { background: var(--amber-soft); } .v-status.amber svg, .v-status.amber h3 { color: var(--amber); }
.v-status.bad { background: var(--seal-soft); } .v-status.bad svg, .v-status.bad h3 { color: var(--seal); }
.v-status.muted { background: var(--panel); } .v-status.muted svg, .v-status.muted h3 { color: var(--muted); }
.v-sig { display: grid; gap: 8px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); }
.v-sig-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.v-sig-head strong { font-size: 14px; font-weight: 600; }
.v-sig-head span { color: var(--muted); }
.v-rows { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 12px; align-items: center; }
.v-rows > span:nth-child(odd) { color: var(--muted); }
.v-note { margin: 0; font-size: 12px; line-height: 1.55; color: var(--muted); }
.v-note.ok { color: var(--ok); } .v-note.amber { color: var(--amber); } .v-note.bad { color: var(--seal); }
.badge { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 10px; font-size: 11px; font-weight: 600; background: var(--accent-soft); color: var(--accent); }
.badge.plain { background: var(--panel); color: var(--muted); border: 1px solid var(--line); }
.fp { display: flex; align-items: center; gap: 6px; min-width: 0; }
.fp code { font-family: var(--font-num); font-size: 11.5px; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
.fp .btn { flex: none; }
.caveat { margin: 0; padding: 8px 10px; border-radius: 8px; background: var(--panel); font-size: 12px; line-height: 1.55; color: var(--muted); }
.warn-box { margin: 0; padding: 8px 10px; border-radius: 8px; background: var(--amber-soft); color: var(--fg); font-size: 12px; line-height: 1.55; }

   ================================================================ */
// asset: { id, kind, name, src (data URL), mime, w, h, hasAlpha, autoRemoveBg, created, lastUsed?, lastW?, hidden?, sample? }

  for (const row of $$("#fb-list .fb-row")) {
    const i = +row.dataset.i;
    row.setAttribute("aria-selected", String(FB.sel.has(i)));
    row.classList.toggle("cursor", i === FB.cursor);
  }
  fbSyncFooter();
}
function fbSyncFooter() {
  const files = [...FB.sel].map((i) => FB.items[i]).filter((it) => it && !it.folder);
  $("#fb-ok").disabled = FB.kind === "folder" ? false : files.length === 0;
  const nFiles = FB.items.filter((it) => !it.folder).length;
  $("#fb-status").textContent = FB.kind === "folder" ? t("fb.selected", { dir: prettyDir(FB.dir) })
    : files.length > 1 ? t("fb.nSelected", { n: files.length }) : files.length === 1 ? files[0].name : t(FB.kind === "pdf" ? "fb.nPdf" : "fb.nImg", { n: nFiles });
  if (FB.kind === "image") { const p = files.length === 1 ? joinPath(FB.dir, files[0].name) : null; if (p !== lastPreviewPath) fbPreview(p); }
}
async function fbPreview(path) {
  lastPreviewPath = path;
  if (FB.previewUrl) { URL.revokeObjectURL(FB.previewUrl); FB.previewUrl = null; }
  const img = $("#fb-preview-img"); img.removeAttribute("src"); $("#fb-preview-name").textContent = path ? basename(path) : t("fb.preview");
  if (!path) return;
  try { const bytes = await S.fs.readFile(path); FB.previewUrl = URL.createObjectURL(new Blob([bytes], { type: mimeOf(path) })); img.src = FB.previewUrl; } catch {}
}
function fbActivate(i) {
  const it = FB.items[i]; if (!it) return;
  if (it.folder) { fbLoad(joinPath(FB.dir, it.name)); return; }
  if (!FB.sel.has(i)) { FB.sel = new Set([i]); FB.cursor = i; }
  fbChoose();
}
function fbChoose() {
  if (FB.kind === "folder") {
    const sel = [...FB.sel].map((i) => FB.items[i]).find((it) => it?.folder);
    fbFinish([sel ? joinPath(FB.dir, sel.name) : FB.dir]); return;
  }
  const files = [...FB.sel].sort((a, b) => a - b).map((i) => FB.items[i]).filter((it) => it && !it.folder);
  if (files.length) fbFinish(files.map((f) => joinPath(FB.dir, f.name)));
}
$("#fb-list").addEventListener("click", (e) => {
  const row = e.target.closest(".fb-row"); if (!row) return;
  const i = +row.dataset.i;
  if (FB.multiple && (e.metaKey || e.ctrlKey)) { FB.sel.has(i) ? FB.sel.delete(i) : FB.sel.add(i); FB.anchor = i; }
  else if (FB.multiple && e.shiftKey && FB.anchor >= 0) { const vis = fbVisible().map((v) => v.i); const a = vis.indexOf(FB.anchor), b = vis.indexOf(i); FB.sel = new Set(vis.slice(Math.min(a, b), Math.max(a, b) + 1)); }
  else { FB.sel = new Set([i]); FB.anchor = i; }
  FB.cursor = i; fbUpdateSelection();
});
$("#fb-list").addEventListener("dblclick", (e) => { const row = e.target.closest(".fb-row"); if (row) fbActivate(+row.dataset.i); });
$("#fb-list").addEventListener("keydown", (e) => {
  const vis = fbVisible().map((v) => v.i);
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    if (e.metaKey && e.key === "ArrowUp") { e.preventDefault(); if (!$("#fb-up").disabled) fbLoad(dirname(FB.dir)); return; }
    if (e.metaKey && e.key === "ArrowDown") { e.preventDefault(); if (FB.cursor >= 0) fbActivate(FB.cursor); return; }
    e.preventDefault(); if (!vis.length) return;
    let k = vis.indexOf(FB.cursor); k = clamp(k + (e.key === "ArrowDown" ? 1 : -1), 0, vis.length - 1);
    FB.cursor = vis[k]; if (!(FB.multiple && e.shiftKey)) { FB.sel = new Set([FB.cursor]); FB.anchor = FB.cursor; } else FB.sel.add(FB.cursor);
    fbUpdateSelection(); $(`.fb-row[data-i="${FB.cursor}"]`)?.scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter") { e.preventDefault(); if (FB.cursor >= 0) fbActivate(FB.cursor); else if (FB.kind === "folder") fbChoose(); }
  else if (e.key === "Backspace") { e.preventDefault(); if (!$("#fb-up").disabled) fbLoad(dirname(FB.dir)); }
  else if (e.key.length === 1 && !e.metaKey && !e.ctrlKey) { $("#fb-filter").focus(); }
});
$("#fb-filter").addEventListener("input", (e) => { FB.filter = e.target.value.trim().toLowerCase(); FB.sel.clear(); FB.cursor = fbVisible()[0]?.i ?? -1; if (FB.cursor >= 0 && !FB.items[FB.cursor].folder) FB.sel.add(FB.cursor); fbRenderList(); });

async function openPdfPath(path) {
  try {
    const st = await S.fs.stat(path).catch(() => null);
    if (st?.size > 300 * 1048576) { toast(t("open.tooBig"), true); return; }
    const bytes = await S.fs.readFile(path);
    await openPdfBytes(new Uint8Array(bytes), basename(path), { path, stat: st ? { size: st.size, mtime: st.mtimeMs } : null });
  } catch { toast(t("open.readFail", { name: basename(path) }), true); }
}
async function choosePdf() {
  if (S.fs) {
    const picked = await browse({ kind: "pdf" });
    if (picked?.length) await openPdfPath(picked[0]);
    return;
  }
  const inp = $("#file-pdf"); inp.value = ""; inp.click();
  if (S.desktop?.window && !navigator.userActivation?.isActive) toast(t("open.useButton"));
}
async function chooseImages() {
  if (S.fs) {
    const picked = await browse({ kind: "image", multiple: true });
    if (!picked?.length) return;
    const items = [];
    for (const p of picked) { try { items.push({ name: basename(p), src: await bytesToDataURL(await S.fs.readFile(p), mimeOf(p)) }); } catch { toast(t("open.readFail", { name: basename(p) }), true); } }
    return importImageSources(items);
  }
  const i = $("#file-img"); i.value = ""; i.click();
}
async function openPdfFile(f) {
  if (!f) return;
  if (f.size > 300 * 1048576) { toast(t("open.tooBig"), true); return; }
  await openPdfBytes(new Uint8Array(await readFile(f, "buffer")), f.name || t("open.defaultName"));
}
$("#file-pdf").addEventListener("change", (e) => openPdfFile(e.target.files[0]));
$("#file-img").addEventListener("change", (e) => importImageFiles([...e.target.files]));

   Keyboard
   ================================================================ */
const COMMANDS = {

  zoomIn: () => setZoom(S.zoom * 1.2), zoomOut: () => setZoom(S.zoom / 1.2), actual: () => setZoom(1),
  fitWidth: () => { S.fit = "width"; applyFit(); }, fitPage: () => { S.fit = "page"; applyFit(); },
  toggleRail: () => { S.prefs.railHidden = !S.prefs.railHidden; $("#main").classList.toggle("no-rail", S.prefs.railHidden); persistPrefs(); setTimeout(() => S.fit && applyFit(), 0); },
  duplicate: duplicateSel, delete: deleteSel, toggleSide: () => toggleSide(),
  verify: openVerify, sealer: openSealer,

const EDITOR_ONLY = new Set(["export", "undo", "redo", "zoomIn", "zoomOut", "actual", "fitWidth", "fitPage", "toggleRail", "duplicate", "delete"]);
function runCommand(cmd) { if (EDITOR_ONLY.has(cmd) && S.view !== "editor") return; COMMANDS[cmd](); }
window.addEventListener("keydown", (e) => {
  if (document.querySelector("dialog[open]")) return;
  const typing = e.target.matches?.("input, textarea, select");
  const mod = e.metaKey || e.ctrlKey;
  const k = e.key.toLowerCase();
  let cmd = null;
  if (mod && e.shiftKey && k === "h") cmd = "home";
  else if (mod && e.shiftKey && k === "i") cmd = "addImage";
  else if (mod && k === "o") cmd = "open";
  else if (mod && k === "s") cmd = "export";
  else if (mod && k === "z" && !typing) cmd = e.shiftKey ? "redo" : "undo";
  else if (mod && k === "y" && !typing) cmd = "redo";
  else if (mod && (k === "=" || k === "+")) cmd = "zoomIn";
  else if (mod && k === "-") cmd = "zoomOut";
  else if (mod && k === "0") cmd = "actual";
  else if (mod && k === "9") cmd = "fitWidth";
  else if (mod && k === "8") cmd = "fitPage";
  else if (mod && e.code === "Backslash") cmd = e.altKey ? "toggleSide" : "toggleRail";
  else if (mod && k === "d" && !typing) cmd = "duplicate";
  if (cmd) { e.preventDefault(); runCommand(cmd); return; }
  if (typing || mod || S.view !== "editor") return;
  if ((k === "backspace" || k === "delete") && S.sel) { e.preventDefault(); deleteSel(); return; }
  if (k === "escape" && S.sel) { select(null); return; }
  const step = e.shiftKey ? 10 : 1;
  const arrows = { arrowleft: [-step, 0], arrowright: [step, 0], arrowup: [0, -step], arrowdown: [0, step] };
  if (arrows[k] && S.sel) { e.preventDefault(); if (e.altKey) resizeSel(...arrows[k], e.shiftKey); else nudge(...arrows[k]); return; }
  if (!S.pages.length) return;
  if (k === "arrowleft" || k === "pageup") { e.preventDefault(); goToPage(S.cur - 1); }
  if (k === "arrowright" || k === "pagedown") { e.preventDefault(); goToPage(S.cur + 1); }
});

// a focused placed item takes its own keys (it need not be selected first); ⌘ shortcuts fall through
pagesEl.addEventListener("keydown", (e) => {
  const n = e.target; if (!n.classList?.contains("ov") || e.metaKey || e.ctrlKey || e.isComposing) return;
  const o = getOv(n.dataset.id); if (!o) return;
  const k = e.key, dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (k === "Enter" || k === " ") {
    e.preventDefault(); e.stopPropagation();
    if (S.sel === o.id) { select(null); announce(t("ov.deselected")); } else { select(o.id); announce(t("ov.selected", { label: ovLabel(o) })); }
  } else if (k === "Escape") {
    if (S.sel) { e.stopPropagation(); select(null); announce(t("ov.deselected")); }
  } else if (k === "Delete" || k === "Backspace") {
    e.preventDefault(); e.stopPropagation(); select(o.id); deleteSel();
  } else if (dirs[k]) {
    e.preventDefault(); e.stopPropagation();
    if (S.sel !== o.id) { flushKeyGesture(); select(o.id); }
    const [dx, dy] = dirs[k], step = e.shiftKey ? 10 : 1;
    if (e.altKey) resizeSel(dx, dy, e.shiftKey); else nudge(dx * step, dy * step);
  }

/* ================================================================
   Signature pad
   ================================================================ */
const pad = { strokes: [], cur: null, color: "#1d3fb8", width: 2.6 };
const padCanvas = $("#pad");
function padResize() {
  const r = padCanvas.getBoundingClientRect(); const dpr = window.devicePixelRatio || 1;
  padCanvas.width = Math.round(r.width * dpr); padCanvas.height = Math.round(r.height * dpr); padDraw();
}
function strokePath(g, pts, scale, color, base) {
  g.strokeStyle = color; g.lineCap = "round"; g.lineJoin = "round";
  if (pts.length === 1) { g.fillStyle = color; g.beginPath(); g.arc(pts[0].x * scale, pts[0].y * scale, base * scale * 0.6, 0, Math.PI * 2); g.fill(); return; }
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const v = Math.hypot(b.x - a.x, b.y - a.y) / Math.max(1, b.t - a.t);
    const w = base * clamp(1.35 - v * 0.35, 0.55, 1.35);
    const m0 = i > 1 ? { x: (pts[i - 2].x + a.x) / 2, y: (pts[i - 2].y + a.y) / 2 } : a;
    const m1 = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    g.lineWidth = w * scale; g.beginPath(); g.moveTo(m0.x * scale, m0.y * scale); g.quadraticCurveTo(a.x * scale, a.y * scale, m1.x * scale, m1.y * scale); g.stroke();
  }
}
function padDraw() {
  const g = padCanvas.getContext("2d"); const dpr = padCanvas.width / (padCanvas.getBoundingClientRect().width || 1);
  g.clearRect(0, 0, padCanvas.width, padCanvas.height);
  for (const s of [...pad.strokes, pad.cur].filter(Boolean)) strokePath(g, s.pts, dpr, s.color, s.width);
  $("#pad-hint").hidden = pad.strokes.length > 0 || !!pad.cur;
  $("#pad-save").disabled = pad.strokes.length === 0;
}
// one stroke at a time (a second finger or a resting palm is ignored); once a stylus has touched the pad, fingers
// are taken for the hand resting on the screen. Finger and stylus input is smoothed (no pressure: same line for all).
padCanvas.addEventListener("pointerdown", (e) => {
  if (pad.cur) return;
  if (e.pointerType === "pen") pad.pen = true;
  else if (e.pointerType === "touch" && (pad.pen || !e.isPrimary)) return;
  try { padCanvas.setPointerCapture(e.pointerId); } catch {}
  const r = padCanvas.getBoundingClientRect();
  pad.ptr = e.pointerId;
  pad.cur = { color: pad.color, width: pad.width, pts: [{ x: e.clientX - r.left, y: e.clientY - r.top, t: e.timeStamp }], raw: null }; padDraw();
});
const PAD_SMOOTH = { touch: 0.42, pen: 0.6 }; // share of each new point taken (mouse: 1, as drawn)
padCanvas.addEventListener("pointermove", (e) => {
  if (!pad.cur || e.pointerId !== pad.ptr) return; const r = padCanvas.getBoundingClientRect();
  const k = PAD_SMOOTH[e.pointerType] || 1, pts = pad.cur.pts;
  const list = e.getCoalescedEvents?.();
  for (const ev of list?.length ? list : [e]) {
    let x = ev.clientX - r.left, y = ev.clientY - r.top;
    if (k < 1) {
      pad.cur.raw = { x, y, t: ev.timeStamp };
      const last = pts[pts.length - 1];
      x = last.x + (x - last.x) * k; y = last.y + (y - last.y) * k;
      if (Math.hypot(x - last.x, y - last.y) < 0.75) continue; // finger jitter
    }
    pts.push({ x, y, t: ev.timeStamp });
  }
  padDraw();
});
const padUp = (e) => {
  if (!pad.cur || (e && e.pointerId !== pad.ptr)) return;
  if (pad.cur.raw) pad.cur.pts.push(pad.cur.raw); // the line ends where the finger lifted
  delete pad.cur.raw; pad.strokes.push(pad.cur); pad.cur = null; pad.ptr = null; padDraw();
};
padCanvas.addEventListener("pointerup", padUp); padCanvas.addEventListener("pointercancel", padUp);
$("#pad-undo").onclick = () => { pad.strokes.pop(); padDraw(); };
$("#pad-clear").onclick = () => { pad.strokes = []; padDraw(); };
$("#pad-width").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return; pad.width = +b.dataset.w;
  for (const x of $("#pad-width").children) x.setAttribute("aria-pressed", String(x === b));
});
function swatchRow(container, colors, getter, setter) {
  container.textContent = "";
  for (const c of colors) container.append(el("button", { type: "button", class: "sw", "aria-pressed": String(getter() === c.color), onclick: (e) => {
    setter(c.color); for (const x of container.children) x.setAttribute("aria-pressed", String(x === e.currentTarget));
  } }, el("i", { style: `background:${c.color}` }), t(c.name)));

const padSwatches = () => swatchRow($("#pad-colors"), INKS.slice(1), () => pad.color, (c) => { pad.color = c; for (const s of pad.strokes) s.color = c; padDraw(); });
padSwatches();
$("#pad-save").onclick = async () => {
  const pts = pad.strokes.flatMap((s) => s.pts); if (!pts.length) return;
  const m = 8, scale = 3;
  const minX = Math.min(...pts.map((p) => p.x)) - m, minY = Math.min(...pts.map((p) => p.y)) - m;
  const maxX = Math.max(...pts.map((p) => p.x)) + m, maxY = Math.max(...pts.map((p) => p.y)) + m;
  const c = canvasOf(Math.ceil((maxX - minX) * scale), Math.ceil((maxY - minY) * scale));
  const g = c.getContext("2d"); g.translate(-minX * scale, -minY * scale);
  for (const s of pad.strokes) strokePath(g, s.pts, scale, s.color, s.width);
  const a = await makeAssetFromSource(c.toDataURL("image/png"), { kind: "draw", name: t("draw.name", { date: new Date().toLocaleDateString(LOCALE(), { month: "numeric", day: "numeric" }) }) });
  $("#dlg-draw").close(); await addToLibrary(a); if (S.view === "editor") placeAsset(a.id); else toast(t("draw.added"));
};

/* ================================================================
   Text / date stamp
   ================================================================ */
const txt = { font: "sans", color: "#111318" };
const FONTS = { sans: '600 120px "IBM Plex Sans KR", "Apple SD Gothic Neo", sans-serif', pen: '120px "Nanum Pen Script", cursive', serif: '800 120px "Nanum Myeongjo", serif' };
async function renderText(text, font = txt.font, color = txt.color) {
  if (MARK_OF[text]) return drawMark(MARK_OF[text], color);
  try { await document.fonts.load(FONTS[font], text); } catch {}
  const m = canvasOf(4, 4).getContext("2d"); m.font = FONTS[font];
  const mt = m.measureText(text);
  const asc = Math.ceil(mt.actualBoundingBoxAscent || 100), desc = Math.ceil(mt.actualBoundingBoxDescent || 30);
  const p = 14, w = Math.ceil(mt.width) + p * 2, h = asc + desc + p * 2;
  const c = canvasOf(w, h); const g = c.getContext("2d");
  g.font = FONTS[font]; g.fillStyle = color; g.textBaseline = "alphabetic"; g.fillText(text, p, p + asc);
  return c;
}
/* marks for forms (✓ ✗ ○): drawn as strokes rather than taken from a font, so they look the same everywhere and
   stay sharp at checkbox size (240 px square, placed at about 5 mm, is over 1200 dpi) */
const MARKS = [["check", "✓"], ["cross", "✗"], ["circle", "○"]];
const MARK_OF = { "✓": "check", "✔": "check", "✗": "cross", "✘": "cross", "○": "circle", "◯": "circle" };
const MARK_PATHS = { check: "M3.6 8.4 6.5 11.3 12.6 4.6", cross: "m4 4 8 8M12 4l-8 8", circle: "M8 2.6a5.4 5.4 0 1 0 0 10.8A5.4 5.4 0 1 0 8 2.6" };
function drawMark(kind, color, N = 240) {
  const c = canvasOf(N, N), g = c.getContext("2d");
  g.scale(N / 16, N / 16); g.strokeStyle = color; g.lineCap = "round"; g.lineJoin = "round";
  g.lineWidth = kind === "circle" ? 1.35 : 1.6;
  g.stroke(new Path2D(MARK_PATHS[kind]));
  return c;
}
async function syncTextPreview() {
  const v = $("#txt-input").value.trim(); $("#txt-save").disabled = !v;
  for (const b of $$("#txt-marks button")) b.setAttribute("aria-pressed", String(MARK_OF[v] === b.dataset.mark));
  const pv = $("#txt-preview");
  if (!v) { pv.width = pv.height = 1; return; }
  const c = await renderText(v); pv.width = c.width; pv.height = c.height; pv.getContext("2d").drawImage(c, 0, 0);
}
$("#txt-input").addEventListener("input", syncTextPreview);
$("#txt-input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing && $("#txt-input").value.trim()) { e.preventDefault(); $("#txt-save").click(); } });
$("#txt-font").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return; txt.font = b.dataset.f;
  for (const x of $("#txt-font").children) x.setAttribute("aria-pressed", String(x === b)); syncTextPreview();

// install status line (Claude desktop, not installed): kept as a key so a language switch redraws it
let installStatus = null;
function syncInstallStatus() { const s = $("#st-install"); s.textContent = installStatus ? t(...installStatus) : ""; s.hidden = !installStatus; }
async function setupDesktop() {
  let desktop = null;
  const status = (key, p) => { installStatus = key ? [key, p] : null; syncInstallStatus(); };
  try { desktop = window.claude?.use ? await window.claude.use("desktop") : null; } catch { desktop = null; }
  if (!desktop) { if (window.claude?.use) status("install.off"); return; }
  S.desktop = desktop;
  const platform = desktop.platform || (await desktop.os?.platform?.().catch(() => "")) || "";
  if (platform === "win32") { OS.win = true; document.documentElement.classList.add("is-win"); rerenderAll(); }
  // the Android app (docs/design/android.md): touch first, the Files app's words, no window chrome
  S.mobile = desktop.mobile === true || platform === "android";

    document.documentElement.classList.add("is-desktop");

    const overlay = desktop.standalone && platform !== "darwin";

    if (overlay) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => desktop.window.setOptions({ titleBarOverlay: barColors() }).catch(() => {}));
    await tellShellLanguage();

}

// the standalone shell switches the labels it owns (app/Edit/Window/Help menus, its dialogs); may be absent
async function tellShellLanguage() { try { await S.desktop?.setLanguage?.(LANG); } catch (e) { console.warn("setLanguage", e); } }
async function setLang(lang, { save = true } = {}) {
  if (!LANGS.includes(lang)) return;
  if (save) { S.prefs.lang = lang; persistPrefs(); }
  if (lang === LANG) { syncLangSwitch(); return; }
  LANG = lang;
  try { localStorage.setItem("pdfe.lang", lang); } catch {}
  rerenderAll();
  if (S.desktop?.window) { await tellShellLanguage(); sendMenu(); }
}
function syncLangSwitch() {
  const box = $("#lang-sw"); box.textContent = "";
  LANGS.forEach((l, i) => {
    if (i) box.append(el("i", { "aria-hidden": "true", text: "·" }));
    box.append(el("button", { type: "button", lang: l, "aria-pressed": String(l === LANG), onclick: () => setLang(l) }, LANG_NAMES[l]));
  });
}

  else if (S.doc.sampleLang !== LANG) loadExample(S.doc.exampleId || "freelance");
}
